services:

  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      USER_SERVICE_URL_1: http://user-service-1:3001
      USER_SERVICE_URL_2: http://user-service-2:3001
      USER_SERVICE_URL_3: http://user-service-3:3001
    depends_on:
      - redis
      - user-service-1
      - user-service-2
      - user-service-3

  redis:
    image: redis:7-alpine
    container_name: api-gateway-redis
    ports:
      - "6379:6379"

  user-service-1:
    build: ./services/user-service
    container_name: user-service-1
    ports:
      - "3001:3001"

  user-service-2:
    build: ./services/user-service
    container_name: user-service-2
    ports:
      - "3002:3001"

  user-service-3:
    build: ./services/user-service
    container_name: user-service-3
    ports:
      - "3003:3001"

  prometheus:
    image: prom/prometheus
    container_name: api-gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./gateway/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana
    container_name: api-gateway-grafana
    ports:
      - "3007:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus


volumes:
  prometheus-data:
  grafana-data: